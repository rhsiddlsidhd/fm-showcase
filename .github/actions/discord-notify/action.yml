name: Discord Notify
description: 완성된 보고서 본문을 Discord webhook으로 보낸다. 본문은 호출하는 워크플로가 완성해서 넘긴다.

inputs:
  body:
    description: 전송할 본문. 서식은 docs/reports/formats.md가 정한다
    required: true
  webhook_url:
    description: Discord webhook URL. 저장소 Secret에서만 넘긴다
    required: true

runs:
  using: composite
  steps:
    - name: 전송
      shell: bash
      env:
        BODY: ${{ inputs.body }}
        WEBHOOK_URL: ${{ inputs.webhook_url }}
        LC_ALL: C.UTF-8
      run: |
        set -euo pipefail

        # 본문은 LLM이 만든 문자열이다. ${{ }}로 스크립트에 보간하지 않고 환경변수로만 받는다.
        if [ -z "${BODY//[[:space:]]/}" ]; then
          echo "본문이 비어 전송하지 않는다." >&2
          exit 1
        fi

        length=$(printf '%s' "$BODY" | wc -m)
        if [ "$length" -gt 2000 ]; then
          echo "본문이 ${length}자로 Discord 한계 2000자를 넘어 전송하지 않는다. 임의로 자르지 않는다." >&2
          exit 1
        fi

        payload="$RUNNER_TEMP/discord-payload.json"
        jq -n --arg content "$BODY" '{content: $content}' > "$payload"

        curl --silent --show-error --fail-with-body \
          --header 'Content-Type: application/json' \
          --data "@$payload" \
          "$WEBHOOK_URL"

        echo "전송 완료 (${length}자)"

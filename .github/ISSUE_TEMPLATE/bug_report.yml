name: Bug report
description: 기대와 다르게 동작하는 문제를 제보한다
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 실제 동작과 기대 동작을 쓴다.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: 재현 절차와 환경(브라우저, Node 버전)을 쓴다.
      placeholder: |
        1.
        2.
        환경:
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: 완료 조건
      description: 완료 조건을 검증 가능한 문장으로 쓴다. 위 재현 절차에서 기대 동작이 나오는지 포함한다.
      placeholder: "- "
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: 에러 메시지를 원문 그대로 붙인다.
      render: shell

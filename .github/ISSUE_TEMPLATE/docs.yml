name: Docs
description: 문서가 결과물인 일을 제안한다. 코드 변경이 함께 있으면 그 코드의 템플릿을 쓴다
title: "docs: "
labels: [docs]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 문서에 무엇이 빠졌거나 틀렸는지 쓴다.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: 완료 조건
      description: 끝났을 때 문서에서 확인할 상태를 검증 가능한 문장으로 쓴다. 문안은 쓰지 않는다. 문서 위치가 이미 정해졌으면 확인할 수 있는 조건으로 쓴다.
      placeholder: "- "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 이 Issue에서 하지 않는 것을 쓴다. 다른 Issue와의 관계는 Relationships로 건다.

name: Refactor
description: 동작은 그대로 두고 코드 구조·규약·성능을 고친다. 사용자가 보는 결과는 바뀌지 않는다
title: "refactor: "
labels: [refactor]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 지금 구조의 무엇이 문제인지 쓴다.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: 끝났을 때 확인할 상태를 검증 가능한 문장으로 쓴다. 동작이 바뀌지 않았음을 판정할 조건을 포함한다. 바꾸는 방법은 쓰지 않는다. 이미 정해진 구조 제약은 확인할 수 있는 조건으로 쓴다.
      placeholder: "- "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 이 Issue에서 하지 않는 것을 쓴다. 다른 Issue와의 관계는 Relationships로 건다.

name: Chore
description: 개발 환경과 작업 도구(CI, git 훅, 스킬, 의존성)를 바꾼다. 앱 코드 구조를 위한 변경은 Refactor를 쓴다
title: "chore: "
labels: [chore]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 지금 개발 환경이나 작업 흐름에서 무엇이 불편하거나 빠졌는지 쓴다.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: 끝났을 때 확인할 상태를 검증 가능한 문장으로 쓴다. 도구·구현 방식은 쓰지 않는다. 이미 정해진 제약은 확인할 수 있는 조건으로 쓴다.
      placeholder: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 이 Issue에서 하지 않는 것을 쓴다. 다른 Issue와의 관계는 Relationships로 건다.

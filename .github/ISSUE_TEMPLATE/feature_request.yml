name: Feature request
description: 쇼케이스 사이트에 새 기능이나 기존 기능 개선을 제안한다. 사용자가 보는 결과가 바뀐다
title: "feat: "
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 왜 필요한지, 지금 무엇이 불편한지 쓴다.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: 완료 조건
      description: 사용자가 보는 결과를 검증 가능한 문장으로 쓴다. 컴포넌트·파일·라이브러리 같은 구현 방식은 쓰지 않는다. 이미 정해진 제약은 확인할 수 있는 조건으로 쓴다.
      placeholder: "- "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 이 Issue에서 하지 않는 것을 쓴다. 다른 Issue와의 관계는 Relationships로 건다.
